# PHASE 65 — local Kong gateway (DB-less declarative). Routes the single
# test base URL to PostgREST and GoTrue. Local-only, loopback, no cloud.
_format_version: "2.1"

services:
  - name: rest-v1
    url: http://ph61_rest:3000/
    routes:
      - name: rest-v1-all
        paths:
          - /rest/v1
        strip_path: true
  - name: auth-v1
    url: http://ph61_auth:9999/
    routes:
      - name: auth-v1-all
        paths:
          - /auth/v1
        strip_path: true

plugins:
  - name: cors
    config:
      origins:
        - http://127.0.0.1:5173
        - http://127.0.0.1:55173
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - x-supabase-api-version
        - Accept
        - Prefer
        - Range
        - Accept-Profile
        - Content-Profile
        - Authorization
        - Content-Type
        - apikey
        - x-client-info
      exposed_headers:
        - Content-Range
        - X-Total-Count
      credentials: true
      max_age: 3600
